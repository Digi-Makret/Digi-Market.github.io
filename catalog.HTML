<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Essentials | Kifar</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    h1 { text-align: center; margin-bottom: 20px; }
    .sort-container { text-align: center; margin-bottom: 20px; }
    select { padding: 8px 12px; font-size: 16px; margin-left: 10px; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s;
    }

    .product-card:hover { transform: translateY(-5px); }

    .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }

    .product-card h3 { font-size: 16px; margin-bottom: 5px; }
    .product-card p { font-size: 14px; color: #555; margin-bottom: 5px; }
    .product-card .price { font-weight: bold; color: #000; margin-bottom: 10px; }
    .product-card button {
      padding: 8px 12px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .product-card button:hover { background: #0056b3; }
  </style>
</head>
<body>

<h1>Dorm Essentials</h1>

<div class="sort-container">
  <label for="sortSelect">Sort by:</label>
  <select id="sortSelect">
    <option value="name">Name</option>
    <option value="category">Category</option>
    <option value="price">Price</option>
  </select>
</div>

<div class="product-grid" id="productGrid">
  <!-- Products will be injected here -->
</div>

<script>
  // Example products (replace image URLs & prices with your actual products)
  const products = [
    {name: "Lighted Makeup Mirror", category: "Bedding & Comfort", price: 29.99, img: "images/mirror.jpg", id: "p1"},
    {name: "Storage Ottoman", category: "Bedding & Comfort", price: 49.99, img: "images/ottoman.jpg", id: "p2"},
    {name: "Air Purifier", category: "Bedding & Comfort", price: 89.99, img: "images/airpurifier.jpg", id: "p3"},
    {name: "Desk Lamp", category: "Furniture & Workspace", price: 19.99, img: "images/desklamp.jpg", id: "p4"},
    {name: "Mini Fridge", category: "Kitchen & Dining", price: 99.99, img: "images/minifridge.jpg", id: "p5"},
    {name: "Fairy Lights", category: "Lifestyle & Extras", price: 14.99, img: "images/fairylights.jpg", id: "p6"},
    // Add all other products here...
  ];

  const productGrid = document.getElementById('productGrid');
  const sortSelect = document.getElementById('sortSelect');

  function displayProducts(arr) {
    productGrid.innerHTML = '';
    arr.forEach(product => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img src="${product.img}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>${product.category}</p>
        <p class="price">$${product.price.toFixed(2)}</p>
        <button onclick="addToCart('${product.id}')">Add to Cart</button>
      `;
      productGrid.appendChild(card);
    });
  }

  function sortProducts(criteria) {
    const sorted = [...products].sort((a, b) => {
      if(criteria === "price") return a.price - b.price;
      if(a[criteria] < b[criteria]) return -1;
      if(a[criteria] > b[criteria]) return 1;
      return 0;
    });
    displayProducts(sorted);
  }

  sortSelect.addEventListener('change', (e) => {
    sortProducts(e.target.value);
  });

  // Placeholder addToCart function
  function addToCart(productId) {
    // Replace with your actual cart integration
    alert(`Added ${productId} to cart`);
  }

  // Initial display
  displayProducts(products);
</script>

</body>
</html>
