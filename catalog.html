<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorm Essentials | Kifar</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
h1 { text-align: center; margin-bottom: 20px; }
.sort-container { text-align: center; margin-bottom: 20px; }
select { padding: 8px 12px; font-size: 16px; margin-left: 10px; }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.product-card { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; transition: transform 0.2s; }
.product-card:hover { transform: translateY(-5px); }
.product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
.product-card h3 { font-size: 16px; margin-bottom: 5px; }
.product-card p { font-size: 14px; color: #555; margin-bottom: 5px; }
.product-card .price { font-weight: bold; color: #000; margin-bottom: 10px; }
.product-card button { padding: 8px 12px; background: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; }
.product-card button:hover { background: #0056b3; }
</style>
</head>
<body>

<h1>Dorm Essentials</h1>

<div class="sort-container">
  <label for="sortSelect">Sort by:</label>
  <select id="sortSelect">
    <option value="name">Name</option>
    <option value="category">Category</option>
    <option value="price">Price</option>
  </select>
</div>

<div class="product-grid" id="productGrid"></div>

<script>
const products = [
  // Bedding & Comfort
  {name: "Lighted Makeup Mirror", category: "Bedding & Comfort", price: 29.99, img: "https://via.placeholder.com/200x150?text=Mirror", id: "p1"},
  {name: "Storage Ottoman", category: "Bedding & Comfort", price: 49.99, img: "https://via.placeholder.com/200x150?text=Ottoman", id: "p2"},
  {name: "Air Purifier", category: "Bedding & Comfort", price: 89.99, img: "https://via.placeholder.com/200x150?text=Air+Purifier", id: "p3"},
  {name: "Brita Filtered Pitcher", category: "Bedding & Comfort", price: 24.99, img: "https://via.placeholder.com/200x150?text=Pitcher", id: "p4"},
  {name: "Dorm Bed Skirt", category: "Bedding & Comfort", price: 19.99, img: "https://via.placeholder.com/200x150?text=Bed+Skirt", id: "p5"},
  {name: "Sleepyhead Mattress Topper", category: "Bedding & Comfort", price: 59.99, img: "https://via.placeholder.com/200x150?text=Mattress+Topper", id: "p6"},
  {name: "Charging Headboard", category: "Bedding & Comfort", price: 39.99, img: "https://via.placeholder.com/200x150?text=Headboard", id: "p7"},
  {name: "Full Body Mirror", category: "Bedding & Comfort", price: 49.99, img: "https://via.placeholder.com/200x150?text=Full+Mirror", id: "p8"},
  {name: "Blackout Curtains", category: "Bedding & Comfort", price: 29.99, img: "https://via.placeholder.com/200x150?text=Curtains", id: "p9"},
  {name: "Gel Memory Foam Pillow", category: "Bedding & Comfort", price: 19.99, img: "https://via.placeholder.com/200x150?text=Pillow", id: "p10"},
  // Organization & Storage
  {name: "Rolling Utility Cart", category: "Organization & Storage", price: 34.99, img: "https://via.placeholder.com/200x150?text=Utility+Cart", id: "p11"},
  {name: "Wheeled Laundry Hamper", category: "Organization & Storage", price: 24.99, img: "https://via.placeholder.com/200x150?text=Laundry+Hamper", id: "p12"},
  {name: "Collapsible Laundry Bin", category: "Organization & Storage", price: 14.99, img: "https://via.placeholder.com/200x150?text=Laundry+Bin", id: "p13"},
  {name: "Collapsible Drying Rack", category: "Organization & Storage", price: 19.99, img: "https://via.placeholder.com/200x150?text=Drying+Rack", id: "p14"},
  {name: "Command Strip Kit", category: "Organization & Storage", price: 9.99, img: "https://via.placeholder.com/200x150?text=Command+Strips", id: "p15"},
  {name: "Drawer Organizers", category: "Organization & Storage", price: 12.99, img: "https://via.placeholder.com/200x150?text=Drawer+Organizers", id: "p16"},
  {name: "Closet Storage Baskets", category: "Organization & Storage", price: 29.99, img: "https://via.placeholder.com/200x150?text=Closet+Baskets", id: "p17"},
  {name: "Closet Organizer", category: "Organization & Storage", price: 34.99, img: "https://via.placeholder.com/200x150?text=Closet+Organizer", id: "p18"},
  {name: "Over the Door Hanger", category: "Organization & Storage", price: 14.99, img: "https://via.placeholder.com/200x150?text=Door+Hanger", id: "p19"},
  {name: "Underbed Storage Bins", category: "Organization & Storage", price: 24.99, img: "https://via.placeholder.com/200x150?text=Underbed+Bins", id: "p20"},
  // Add remaining products here in same format (fill all 100 dorm essentials)
];

const productGrid = document.getElementById('productGrid');
const sortSelect = document.getElementById('sortSelect');

function displayProducts(arr) {
  productGrid.innerHTML = '';
  arr.forEach(product => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <img src="${product.img}" alt="${product.name}">
      <h3>${product.name}</h3>
      <p>${product.category}</p>
      <p class="price">$${product.price.toFixed(2)}</p>
      <button onclick="addToCart('${product.id}')">Add to Cart</button>
    `;
    productGrid.appendChild(card);
  });
}

function sortProducts(criteria) {
  const sorted = [...products].sort((a, b) => {
    if(criteria === "price") return a.price - b.price;
    if(a[criteria] < b[criteria]) return -1;
    if(a[criteria] > b[criteria]) return 1;
    return 0;
  });
  displayProducts(sorted);
}

sortSelect.addEventListener('change', (e) => {
  sortProducts(e.target.value);
});

function addToCart(productId) {
  // Integrate with your existing cart system
  alert(`Added product ${productId} to cart`);
}

// Initial display
displayProducts(products);
</script>

</body>
</html>
